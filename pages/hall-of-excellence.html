<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hall of Excellence — FUTUREPROOF</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..900,0..100,0..1;1,9..144,300..900,0..100,0..1&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
</head>
<body class="bg-white text-on-surface">

  <header class="topbar fixed top-0 left-0 right-0 z-50 backdrop-blur-md" style="height:56px;">
    <div class="h-full max-w-1600 mx-auto px-6 lg:px-12 flex items-center justify-between text-xs">
      <div class="flex items-center gap-6">
        <a href="../index.html" class="flex items-center gap-2 hover:opacity-80 transition">
          <div class="status-pulse"></div><span class="topbar-brand">FUTUREPROOF</span>
        </a>
        <span class="topbar-name">Hall Of Excellence</span>
      </div>
      <a href="../index.html" class="nav-btn">← Home</a>
    </div>
  </header>

  <main id="main" class="max-w-1600 mx-auto px-6 lg:px-12 pt-32 pb-24">

    <div class="flex items-center gap-4 mb-4 flex-wrap">
      <span class="topbar-name">Public Gallery</span>
      <div class="h-line flex-1 max-w-32"></div>
    </div>

    <h1 class="display-heading text-5xl lg:text-6xl text-on-surface mb-4 max-w-3xl">
      Student work that<br><em class="text-primary">travels</em>.
    </h1>
    <p class="text-lg text-on-surface/80 leading-relaxed mb-12 max-w-2xl">
      Curated Pitch Capsules from past missions, published with the consent of the teams that made them.
    </p>

    <div id="hall-grid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6 mb-12"></div>
    <div id="hall-empty" class="alert-info max-w-3xl" hidden>
      The gallery is still loading its first cohort. Check back when teams have submitted with feature consent.
    </div>
  </main>

  <script src="../config.local.js" onerror="window.__noConfig = true;"></script>
  <script type="module">
    import { isFirebaseAvailable } from '../src/auth.js';

    const grid = document.getElementById('hall-grid');
    const empty = document.getElementById('hall-empty');

    const PLACEHOLDER_ENTRIES = [
      { tid: 'demo_atlas', team: 'Atlas Cell', title: 'The Chao Phraya Salt Wedge', sdg: 6, summary: 'A redistribution-of-cost framework for dry-season water shortage decisions.' },
      { tid: 'demo_north', team: 'Northwind', title: 'The Burning Season Decision', sdg: 13, summary: 'A transition-incentive design that does not punish smallholder farmers.' },
      { tid: 'demo_lake',  team: 'Songkhla Six', title: 'Songkhla Lake\'s Last Rinse', sdg: 14, summary: 'A coastal zoning pause grounded in fishery cooperative voice.' },
    ];

    function render(entries) {
      grid.innerHTML = '';
      if (!entries.length) { empty.hidden = false; return; }
      for (const e of entries) {
        const card = document.createElement('article');
        card.className = 'hall-card';
        card.innerHTML = `
          <div class="console-label-gold mb-3">SDG ${String(e.sdg).padStart(2,'0')}</div>
          <h3 class="display-heading text-2xl text-on-surface mb-2">${escapeHtml(e.title)}</h3>
          <div class="mission-title text-xs text-on-surface/70 mb-4">${escapeHtml(e.team)}</div>
          <p class="text-sm text-on-surface/85 leading-relaxed">${escapeHtml(e.summary)}</p>
        `;
        grid.appendChild(card);
      }
    }
    function escapeHtml(s) { return String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c])); }

    if (!isFirebaseAvailable()) {
      render(PLACEHOLDER_ENTRIES);
    } else {
      // In production, fetch /hallOfExcellence (public-readable) and render featured items.
      render(PLACEHOLDER_ENTRIES);
    }
  </script>

  <style>
    .hall-card { border: 1px solid #E5E5E7; background: #FFFFFF; padding: 1.5rem; transition: border-color 0.15s ease; }
    .hall-card:hover { border-color: rgba(168, 138, 74, 0.4); }
  </style>
<script type="module" src="../src/a11y.js"></script>
  <script type="module" src="../src/topbar-actions.js"></script>
</body>
</html>
