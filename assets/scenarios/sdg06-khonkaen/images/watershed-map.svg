<?xml version="1.0" encoding="UTF-8"?>
<!-- Khon Kaen Province · Nam Phong River Basin · Hand-drawn map
     Simplified cartography · illustrative · not topographically exact. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img"
     aria-label="Hand-drawn map of Khon Kaen Province showing the Nam Phong river basin, the Ubolratana Reservoir, and six labelled sub-district locations representing the smallholder farmer, PWA, food-processing facility, community health volunteer's sub-district, Khon Kaen University, and Provincial Hall.">
  <title>Nam Phong watershed · Khon Kaen Province</title>

  <defs>
    <pattern id="map-land" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#F4E9D4"/>
      <circle cx="6"  cy="12" r="0.5" fill="#8C5E23" opacity="0.4"/>
      <circle cx="22" cy="28" r="0.4" fill="#8C5E23" opacity="0.4"/>
      <circle cx="32" cy="6"  r="0.5" fill="#8C5E23" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Bone background -->
  <rect width="1024" height="1024" fill="#F4F1EA"/>

  <!-- Province outline (simplified hand-drawn polygon) -->
  <path d="M 200 200
           Q 360 160 540 180
           Q 720 200 820 280
           Q 880 360 880 480
           Q 880 600 820 720
           Q 740 820 560 840
           Q 380 860 240 800
           Q 140 720 140 580
           Q 140 420 200 200 Z"
        fill="url(#map-land)" stroke="#1A1F2E" stroke-width="2.5"/>

  <!-- Border decoration -->
  <path d="M 200 200
           Q 360 160 540 180
           Q 720 200 820 280
           Q 880 360 880 480
           Q 880 600 820 720
           Q 740 820 560 840
           Q 380 860 240 800
           Q 140 720 140 580
           Q 140 420 200 200 Z"
        fill="none" stroke="#1A1F2E" stroke-width="1" stroke-dasharray="2 4" opacity="0.4"/>

  <!-- Title compass -->
  <g transform="translate(80 80)" font-family="'JetBrains Mono', monospace">
    <text x="0" y="0" font-family="'Fraunces', serif" font-style="italic"
          font-size="32" font-weight="500" fill="#071734">
      Nam Phong Watershed
    </text>
    <text x="0" y="30" font-size="13" letter-spacing="0.12em" fill="#647293">
      KHON KAEN PROVINCE · NORTHEAST THAILAND
    </text>
    <text x="0" y="50" font-family="'IBM Plex Sans Thai', sans-serif" font-size="13" fill="#647293">
      ลุ่มน้ำพอง · จังหวัดขอนแก่น
    </text>
  </g>

  <!-- N compass -->
  <g transform="translate(900 80)">
    <circle cx="0" cy="0" r="34" fill="#F4F1EA" stroke="#1A1F2E" stroke-width="1.5"/>
    <polygon points="0,-28 6,0 0,-8 -6,0" fill="#B57C34"/>
    <polygon points="0,-8 6,0 0,28 -6,0" fill="#1A1F2E" opacity="0.62"/>
    <text x="0" y="-40" text-anchor="middle" font-family="'JetBrains Mono', monospace"
          font-size="14" font-weight="700" fill="#1A1F2E">N</text>
  </g>

  <!-- Scale bar -->
  <g transform="translate(80 920)">
    <line x1="0" y1="0" x2="120" y2="0" stroke="#1A1F2E" stroke-width="2"/>
    <line x1="0" y1="-4" x2="0" y2="4" stroke="#1A1F2E" stroke-width="2"/>
    <line x1="60" y1="-3" x2="60" y2="3" stroke="#1A1F2E" stroke-width="1.5"/>
    <line x1="120" y1="-4" x2="120" y2="4" stroke="#1A1F2E" stroke-width="2"/>
    <text x="0" y="20" font-family="'JetBrains Mono', monospace" font-size="11" fill="#647293">0 km</text>
    <text x="120" y="20" font-family="'JetBrains Mono', monospace" font-size="11" fill="#647293" text-anchor="end">40 km</text>
  </g>

  <!-- Nam Phong river — curves from upper-left toward lower-right -->
  <path d="M 220 240
           Q 320 280 400 340
           Q 480 380 540 460
           Q 590 540 650 600
           Q 720 660 800 700"
        fill="none" stroke="#5BA8D9" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
  <path d="M 220 240 Q 320 280 400 340 Q 480 380 540 460 Q 590 540 650 600 Q 720 660 800 700"
        fill="none" stroke="#1A4F7A" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 8" opacity="0.5"/>

  <!-- Chi river junction (lower-right) -->
  <path d="M 800 700 Q 850 750 870 800" fill="none" stroke="#5BA8D9" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
  <text x="850" y="780" font-family="'Fraunces', serif" font-style="italic" font-size="16"
        fill="#1A4F7A" opacity="0.85">Chi R.</text>

  <!-- Ubolratana Reservoir -->
  <g transform="translate(400 380)">
    <ellipse cx="0" cy="0" rx="58" ry="36" fill="#5BA8D9" opacity="0.78" stroke="#1A4F7A" stroke-width="1.5"/>
    <text x="0" y="62" text-anchor="middle" font-family="'Fraunces', serif" font-style="italic"
          font-size="18" font-weight="500" fill="#1A4F7A">Ubolratana</text>
    <text x="0" y="80" text-anchor="middle" font-family="'IBM Plex Sans Thai', sans-serif"
          font-size="13" fill="#647293">เขื่อนอุบลรัตน์</text>
  </g>

  <!-- ICON LOCATIONS -->

  <!-- 1. Smallholder farmer (Nong Rua District) -->
  <g transform="translate(280 460)">
    <circle cx="0" cy="0" r="24" fill="#F4E9D4" stroke="#B57C34" stroke-width="2.5"/>
    <g transform="translate(-10 -10)" fill="#B57C34">
      <!-- Rice plant icon -->
      <line x1="6" y1="20" x2="6" y2="6" stroke="#B57C34" stroke-width="2"/>
      <line x1="14" y1="20" x2="14" y2="4" stroke="#B57C34" stroke-width="2"/>
      <line x1="6" y1="6" x2="2" y2="2" stroke="#B57C34" stroke-width="2"/>
      <line x1="6" y1="6" x2="10" y2="2" stroke="#B57C34" stroke-width="2"/>
      <line x1="14" y1="4" x2="10" y2="0" stroke="#B57C34" stroke-width="2"/>
      <line x1="14" y1="4" x2="18" y2="0" stroke="#B57C34" stroke-width="2"/>
    </g>
    <text x="32" y="-4" font-family="'DM Sans', sans-serif" font-size="13"
          font-weight="600" fill="#1A1F2E">Smallholder</text>
    <text x="32" y="12" font-family="'IBM Plex Sans Thai', sans-serif" font-size="11" fill="#647293">เกษตรกร · อ.หนองเรือ</text>
  </g>

  <!-- 2. PWA Khon Kaen — Mueang -->
  <g transform="translate(560 540)">
    <circle cx="0" cy="0" r="24" fill="#E4E8F0" stroke="#647293" stroke-width="2.5"/>
    <g transform="translate(-12 -12)" fill="#647293">
      <rect x="6" y="2" width="12" height="8"/>
      <rect x="10" y="10" width="4" height="10"/>
      <rect x="2" y="20" width="20" height="4"/>
    </g>
    <text x="32" y="-4" font-family="'DM Sans', sans-serif" font-size="13"
          font-weight="600" fill="#1A1F2E">PWA Khon Kaen</text>
    <text x="32" y="12" font-family="'IBM Plex Sans Thai', sans-serif" font-size="11" fill="#647293">กปภ. · อ.เมือง</text>
  </g>

  <!-- 3. Food-processing facility — basin area -->
  <g transform="translate(620 660)">
    <circle cx="0" cy="0" r="24" fill="#F8F0E2" stroke="#8C5E23" stroke-width="2.5"/>
    <g transform="translate(-12 -10)" fill="#8C5E23">
      <rect x="0" y="8" width="8" height="12"/>
      <rect x="10" y="4" width="8" height="16"/>
      <rect x="20" y="10" width="4" height="10"/>
      <rect x="3" y="4" width="2" height="6"/>
      <rect x="13" y="0" width="2" height="6"/>
    </g>
    <text x="32" y="-4" font-family="'DM Sans', sans-serif" font-size="13"
          font-weight="600" fill="#1A1F2E">Food-processing</text>
    <text x="32" y="12" font-family="'IBM Plex Sans Thai', sans-serif" font-size="11" fill="#647293">โรงงาน · แอ่งขอนแก่น</text>
  </g>

  <!-- 4. Community Health Volunteer sub-district near Ban Phai -->
  <g transform="translate(440 720)">
    <circle cx="0" cy="0" r="24" fill="#E8F2DC" stroke="#4F7050" stroke-width="2.5"/>
    <g transform="translate(-12 -10)" fill="#4F7050">
      <polygon points="0,20 8,8 16,20"/>
      <rect x="4" y="16" width="8" height="6"/>
      <polygon points="12,20 18,12 24,20"/>
      <rect x="16" y="16" width="4" height="4"/>
    </g>
    <text x="32" y="-4" font-family="'DM Sans', sans-serif" font-size="13"
          font-weight="600" fill="#1A1F2E">Community Health</text>
    <text x="32" y="12" font-family="'IBM Plex Sans Thai', sans-serif" font-size="11" fill="#647293">อสม. · บ้านไผ่</text>
  </g>

  <!-- 5. Khon Kaen University -->
  <g transform="translate(640 480)">
    <circle cx="0" cy="0" r="24" fill="#E4F0FA" stroke="#1A4F7A" stroke-width="2.5"/>
    <g transform="translate(-12 -10)" fill="#1A4F7A">
      <polygon points="0,8 12,2 24,8"/>
      <rect x="2" y="8" width="20" height="2"/>
      <rect x="4" y="10" width="3" height="10"/>
      <rect x="10" y="10" width="4" height="10"/>
      <rect x="17" y="10" width="3" height="10"/>
      <rect x="2" y="20" width="20" height="2"/>
    </g>
    <text x="32" y="-4" font-family="'DM Sans', sans-serif" font-size="13"
          font-weight="600" fill="#1A1F2E">KKU</text>
    <text x="32" y="12" font-family="'IBM Plex Sans Thai', sans-serif" font-size="11" fill="#647293">มหาวิทยาลัยขอนแก่น</text>
  </g>

  <!-- 6. Provincial Hall -->
  <g transform="translate(720 540)">
    <circle cx="0" cy="0" r="24" fill="#F8F0E2" stroke="#B57C34" stroke-width="2.5"/>
    <g transform="translate(-12 -10)" fill="#B57C34">
      <rect x="2" y="14" width="20" height="6"/>
      <rect x="4" y="8" width="3" height="6"/>
      <rect x="10" y="8" width="3" height="6"/>
      <rect x="16" y="8" width="3" height="6"/>
      <polygon points="0,8 12,2 24,8"/>
    </g>
    <text x="32" y="-4" font-family="'DM Sans', sans-serif" font-size="13"
          font-weight="600" fill="#1A1F2E">Provincial Hall</text>
    <text x="32" y="12" font-family="'IBM Plex Sans Thai', sans-serif" font-size="11" fill="#647293">ศาลากลางจังหวัด</text>
  </g>

  <!-- Bottom attribution -->
  <text x="80" y="980" font-family="'JetBrains Mono', monospace" font-size="10"
        letter-spacing="0.06em" fill="#647293">
    HAND-DRAWN MAP · FUTUREPROOF SDG MISSION LAB · NOT TOPOGRAPHICALLY EXACT
  </text>
</svg>
