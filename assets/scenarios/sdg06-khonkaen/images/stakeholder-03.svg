<?xml version="1.0" encoding="UTF-8"?>
<!-- Stakeholder 03 — Food-processing facility Production Director
     Composite role, not a real person. Editorial silhouette in
     warm bronze accent. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img"
     aria-label="Stylized portrait illustration of a Food-processing facility Production Director">
  <title>Food-Processing Facility · Production Director</title>
  <desc>Editorial illustration: silhouette of a business professional holding a clipboard, warm bronze palette. Composite role, not a real person.</desc>

  <defs>
    <linearGradient id="s3-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#F8F0E2"/>
      <stop offset="100%" stop-color="#E8D2B0"/>
    </linearGradient>
    <linearGradient id="s3-figure" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#1A1F2E"/>
      <stop offset="100%" stop-color="#3D3F4E"/>
    </linearGradient>
    <radialGradient id="s3-glow" cx="50%" cy="100%" r="50%">
      <stop offset="0%"  stop-color="#E5B567" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#E5B567" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#s3-bg)"/>

  <!-- Subtle factory silhouette in background -->
  <g opacity="0.16" fill="#8C5E23">
    <rect x="60" y="332" width="100" height="76"/>
    <rect x="170" y="316" width="70" height="92"/>
    <rect x="280" y="340" width="80" height="68"/>
    <rect x="370" y="320" width="60" height="88"/>
    <!-- Smoke stacks -->
    <rect x="180" y="280" width="14" height="40"/>
    <rect x="320" y="290" width="12" height="32"/>
  </g>

  <!-- Floor glow -->
  <rect y="380" width="512" height="100" fill="url(#s3-glow)"/>

  <!-- Subject silhouette -->
  <g fill="url(#s3-figure)">
    <!-- Hair -->
    <path d="M 210 88 Q 256 60 302 88 L 312 142 L 200 142 Z"/>
    <!-- Head -->
    <ellipse cx="256" cy="148" rx="58" ry="75"/>
    <!-- Neck -->
    <rect x="234" y="205" width="44" height="30"/>
    <!-- Shoulders + business shirt -->
    <path d="M 152 232 Q 200 226 232 232 L 232 248 L 280 248 L 280 232 Q 312 226 360 232
             L 360 412 L 152 412 Z"
          fill="#F4F1EA"/>
  </g>

  <!-- Open collar V -->
  <path d="M 232 232 L 256 274 L 280 232 Z" fill="url(#s3-figure)"/>

  <!-- Clipboard -->
  <g transform="translate(310 350)">
    <rect x="0" y="0" width="56" height="74" rx="3" fill="#8C5E23"/>
    <rect x="3" y="3" width="50" height="64" fill="#F4F1EA"/>
    <line x1="8" y1="14" x2="48" y2="14" stroke="#B57C34" stroke-width="1.5"/>
    <line x1="8" y1="22" x2="42" y2="22" stroke="#647293" stroke-width="1"/>
    <line x1="8" y1="28" x2="46" y2="28" stroke="#647293" stroke-width="1"/>
    <line x1="8" y1="34" x2="38" y2="34" stroke="#647293" stroke-width="1"/>
    <line x1="8" y1="42" x2="46" y2="42" stroke="#647293" stroke-width="1"/>
    <line x1="8" y1="48" x2="40" y2="48" stroke="#647293" stroke-width="1"/>
    <rect x="22" y="-4" width="12" height="6" rx="1" fill="#1A1F2E"/>
  </g>

  <!-- Bottom caption strip -->
  <rect x="0" y="466" width="512" height="46" fill="#1A1F2E" opacity="0.88"/>
  <text x="256" y="488" text-anchor="middle"
        font-family="'JetBrains Mono', monospace" font-size="11"
        font-weight="700" letter-spacing="0.16em" fill="#E5B567">
    PRODUCTION DIRECTOR · INDUSTRY
  </text>
  <text x="256" y="503" text-anchor="middle"
        font-family="'IBM Plex Sans Thai', sans-serif" font-size="9"
        fill="#F4F1EA" opacity="0.7">
    ผู้อำนวยการฝ่ายผลิต โรงงานแปรรูปอาหาร
  </text>
</svg>
