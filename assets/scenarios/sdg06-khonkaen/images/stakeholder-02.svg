<?xml version="1.0" encoding="UTF-8"?>
<!-- Stakeholder 02 — PWA Khon Kaen Operations Manager
     Composite role, not a real person. Editorial silhouette in
     soft steel-blue accent. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img"
     aria-label="Stylized portrait illustration of a PWA Operations Manager">
  <title>PWA Operations Manager · Khon Kaen Branch</title>
  <desc>Editorial illustration: silhouette of a professional in a collared shirt with ID badge, soft steel-blue palette. Composite role, not a real person.</desc>

  <defs>
    <linearGradient id="s2-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#E4E8F0"/>
      <stop offset="100%" stop-color="#A8B0C8"/>
    </linearGradient>
    <linearGradient id="s2-figure" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#1A1F2E"/>
      <stop offset="100%" stop-color="#2F3854"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#s2-bg)"/>

  <!-- Architectural backdrop suggestion: institutional building lines -->
  <g opacity="0.18" stroke="#2F3854" stroke-width="1" fill="none">
    <line x1="80" y1="340" x2="80" y2="412"/>
    <line x1="120" y1="340" x2="120" y2="412"/>
    <line x1="392" y1="340" x2="392" y2="412"/>
    <line x1="432" y1="340" x2="432" y2="412"/>
    <line x1="80" y1="340" x2="432" y2="340"/>
    <line x1="80" y1="380" x2="432" y2="380"/>
  </g>

  <!-- Subject silhouette -->
  <g fill="url(#s2-figure)">
    <!-- Hair (pulled back) -->
    <path d="M 200 90 Q 256 60 312 90 L 312 165 L 200 165 Z"/>
    <!-- Head -->
    <ellipse cx="256" cy="150" rx="60" ry="78"/>
    <!-- Neck -->
    <rect x="232" y="208" width="48" height="32"/>
    <!-- Collar (open) -->
    <path d="M 200 240 L 232 234 L 256 252 L 280 234 L 312 240 L 312 280 L 200 280 Z"
          fill="#F4F1EA"/>
    <!-- Torso (blouse) -->
    <path d="M 150 270 Q 200 260 256 268 Q 312 260 362 270
             L 362 412 L 150 412 Z"
          fill="#F4F1EA"/>
  </g>

  <!-- ID badge -->
  <g transform="translate(310 320)">
    <rect x="-18" y="0" width="36" height="48" rx="2" fill="#1A1F2E"/>
    <rect x="-14" y="6" width="28" height="20" fill="#A8B0C8"/>
    <rect x="-14" y="32" width="28" height="3" fill="#647293"/>
    <rect x="-14" y="38" width="22" height="3" fill="#647293"/>
    <line x1="-18" y1="-2" x2="18" y2="-2" stroke="#647293" stroke-width="2"/>
  </g>

  <!-- Folder held -->
  <g transform="translate(180 380)" fill="#647293">
    <rect x="0" y="0" width="56" height="40" rx="2"/>
    <rect x="2" y="4" width="52" height="2" fill="#A8B0C8"/>
    <rect x="2" y="10" width="40" height="2" fill="#A8B0C8"/>
    <rect x="2" y="16" width="46" height="2" fill="#A8B0C8"/>
  </g>

  <!-- Bottom caption strip -->
  <rect x="0" y="466" width="512" height="46" fill="#1A1F2E" opacity="0.88"/>
  <text x="256" y="488" text-anchor="middle"
        font-family="'JetBrains Mono', monospace" font-size="11"
        font-weight="700" letter-spacing="0.16em" fill="#A8B0C8">
    PWA OPS MANAGER · KHON KAEN
  </text>
  <text x="256" y="503" text-anchor="middle"
        font-family="'IBM Plex Sans Thai', sans-serif" font-size="9"
        fill="#F4F1EA" opacity="0.7">
    ผู้จัดการฝ่ายปฏิบัติการ การประปาส่วนภูมิภาคขอนแก่น
  </text>
</svg>
