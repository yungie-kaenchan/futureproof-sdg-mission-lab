<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>LangLab: Methods Vault — Language Institute, TU Rangsit</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Nunito:wght@400;600;700;800&family=Source+Code+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
:root{
  --bg:#0B0F1A;--card:rgba(20,27,45,.82);--card2:rgba(26,35,64,.85);
  --neon:#00ff88;--cyan:#00d4ff;--warn:#ff6b35;--danger:#ff3366;
  --purple:#c084fc;--gold:#ffe066;--text:#e8ecf1;--dim:#a8b3cc;--dark:#3a4a6b;
  --fs-xs:13px;--fs-sm:15px;--fs-base:18px;--fs-md:22px;--fs-lg:28px;--fs-xl:34px;--fs-2xl:42px;--fs-3xl:54px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100vh}
body{background:#0B0F1A;color:var(--text);font-family:'Nunito',system-ui,sans-serif;overflow-x:hidden;font-size:var(--fs-base)}
button{font-family:inherit;border:none;cursor:pointer;font-size:inherit}
input{font-family:inherit;font-size:inherit}
input:focus{outline:2px solid var(--neon)}
.hf{font-family:'Orbitron','Courier New',monospace}
.mf{font-family:'Source Code Pro','Courier New',monospace}
.screen{display:none;min-height:100vh;position:relative;width:100%}
.screen.active{display:flex;flex-direction:column}
.bg-stage{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;background-repeat:no-repeat}
.bg-stage::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,15,26,.55) 0%,rgba(11,15,26,.7) 100%)}
.sc{position:relative;z-index:2}
.wrap{max-width:680px;margin:0 auto;width:100%;padding:24px}

#audio-console{position:fixed;bottom:14px;right:14px;z-index:1000;display:flex;align-items:center;gap:10px;background:rgba(11,15,26,.92);border:1px solid rgba(0,255,136,.35);border-radius:14px;padding:8px 14px;backdrop-filter:blur(10px);box-shadow:0 4px 20px rgba(0,0,0,.4)}
#audio-console .ac-label{font-family:'Source Code Pro',monospace;font-size:10px;letter-spacing:1.5px;color:var(--cyan)}
#audio-console button{background:rgba(0,255,136,.08);color:var(--neon);font-size:18px;padding:6px 10px;border-radius:8px;border:1px solid rgba(0,255,136,.25);line-height:1}
#audio-console button:hover{background:rgba(0,255,136,.18)}
#audio-console input[type=range]{width:80px;accent-color:var(--neon)}

@keyframes glow{0%,100%{box-shadow:0 0 5px var(--neon),0 0 18px rgba(0,255,136,.25)}50%{box-shadow:0 0 18px var(--neon),0 0 42px rgba(0,255,136,.45)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes confetti{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(520px) rotate(720deg);opacity:0}}
.fi{animation:fadeIn .5s ease-out both}
.glow{animation:glow 2.4s ease-in-out infinite}

.card{background:var(--card);border:1px solid rgba(107,127,163,.25);border-radius:16px;padding:20px;margin-bottom:14px;backdrop-filter:blur(6px)}
.opt{width:100%;padding:16px 18px;text-align:left;background:var(--card);border:1px solid rgba(107,127,163,.25);border-radius:12px;color:var(--text);font-size:var(--fs-base);cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:14px;margin-bottom:12px;backdrop-filter:blur(6px)}
.opt:hover{border-color:rgba(0,255,136,.5)}
.opt.sel{background:rgba(0,255,136,.18);border:2px solid var(--neon)}
.opt.elim{opacity:.18;pointer-events:none;text-decoration:line-through}
.opt.right{background:rgba(0,255,136,.22);border:2px solid var(--neon)}
.opt.wrong{background:rgba(255,51,102,.18);border:2px solid var(--danger)}
.oc{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--card2);color:var(--dim);font-size:var(--fs-sm);font-weight:700;flex-shrink:0}
.opt.sel .oc{background:var(--neon);color:#0B0F1A}

.field-label{display:block;text-align:left;font-size:var(--fs-xs);color:var(--cyan);margin-bottom:8px;letter-spacing:1.5px;font-family:'Source Code Pro',monospace}
.field-input{width:100%;padding:14px 16px;background:rgba(11,15,26,.65);border:1px solid rgba(0,255,136,.4);border-radius:10px;color:var(--text)}

.life{display:inline-block;font-size:var(--fs-md);margin:0 3px;transition:all .3s}
.life.lost{opacity:.18;filter:grayscale(1)}

.timer-ring{position:relative;width:74px;height:74px}
.timer-ring svg{transform:rotate(-90deg)}
.timer-ring .tnum{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',monospace;font-size:22px;font-weight:700;color:var(--neon)}
.timer-ring.warn .tnum{color:var(--warn)}
.timer-ring.danger .tnum{color:var(--danger);animation:pulse 1s infinite}

.rule-card{background:var(--card);border-radius:14px;padding:16px 18px;margin-bottom:12px;border-left:3px solid var(--neon);font-size:var(--fs-sm);line-height:1.65;color:var(--dim);backdrop-filter:blur(6px)}
.rule-card strong{color:var(--text)}
.rule-warning{border-left-color:var(--danger)}
.rule-hint{border-left-color:var(--cyan)}

#confetti-box{position:fixed;inset:0;pointer-events:none;z-index:999;display:none}
.cp{position:absolute;top:-20px}

@media(max-width:480px){
  :root{--fs-xs:12px;--fs-sm:14px;--fs-base:16px;--fs-md:19px;--fs-lg:24px;--fs-xl:28px;--fs-2xl:34px;--fs-3xl:42px}
  .wrap{padding:18px}
}
</style>
</head>
<body>
<div class="bg-stage" id="bg-stage"></div>
<audio id="bgm" loop preload="auto"><source src="assets/bgm.mp3" type="audio/mpeg"></audio>

<div id="audio-console">
  <span class="ac-label">AUDIO</span>
  <button id="audio-toggle" title="Play/Pause" onclick="toggleAudio()">▶</button>
  <input type="range" id="audio-vol" min="0" max="100" value="35" oninput="setVol(this.value)" title="Volume">
</div>

<div id="confetti-box"></div>

<!-- LOGIN -->
<div id="login-screen" class="screen active" style="align-items:center;justify-content:center;text-align:center;padding:24px">
  <div class="sc wrap fi" style="max-width:480px">
    <div class="hf" style="font-size:clamp(var(--fs-2xl),9vw,64px);font-weight:900;color:var(--neon);text-shadow:0 0 30px rgba(0,255,136,.5);letter-spacing:2px">LANGLAB</div>
    <div class="hf" style="font-size:clamp(var(--fs-sm),3vw,var(--fs-md));color:var(--cyan);letter-spacing:8px;margin-top:-4px">METHODS · VAULT</div>
    <div style="width:80px;height:2px;background:linear-gradient(90deg,transparent,var(--neon),transparent);margin:18px auto 14px"></div>
    <p class="mf" style="font-size:var(--fs-xs);color:var(--gold);letter-spacing:1px;margin-bottom:6px">LANGUAGE INSTITUTE · THAMMASAT UNIVERSITY</p>
    <p class="mf" style="font-size:var(--fs-xs);color:var(--dim);letter-spacing:1px;margin-bottom:24px">RANGSIT CAMPUS</p>

    <div class="card" style="text-align:left;padding:22px">
      <label class="field-label">PLAYER 1 — Required</label>
      <input id="p1-input" class="field-input" placeholder="Enter name" style="margin-bottom:14px">
      <label class="field-label">PLAYER 2 — Optional (solo or pair)</label>
      <input id="p2-input" class="field-input" placeholder="Leave blank if playing solo" style="margin-bottom:14px">
      <label class="field-label">TEAM NAME — Required</label>
      <input id="team-input" class="field-input" placeholder="e.g. Team Phoenix">
      <div id="login-error" style="color:var(--danger);font-size:var(--fs-xs);margin-top:10px;min-height:18px"></div>
    </div>

    <button id="login-btn" class="hf glow" style="width:100%;padding:18px;background:linear-gradient(135deg,var(--neon),var(--cyan));border-radius:12px;color:#0B0F1A;font-size:var(--fs-base);font-weight:800;letter-spacing:1.5px;margin-top:6px">INITIALIZE ACCESS →</button>
    <div class="mf" style="margin-top:20px;font-size:var(--fs-xs);color:var(--dark);letter-spacing:1px">ELT METHODS &amp; APPROACHES · 12 CHALLENGES · 4 LIFE POWERS</div>
    <div style="margin-top:14px"><a href="admin.html" class="mf" style="font-size:var(--fs-xs);color:var(--cyan);text-decoration:none;letter-spacing:1.5px;opacity:.7">⚙ ADMIN CONSOLE</a></div>
  </div>
</div>

<!-- INSTRUCTIONS -->
<div id="instruct-screen" class="screen" style="align-items:center;padding:24px">
  <div class="sc wrap" id="instruct-wrap"></div>
</div>

<!-- QUESTION -->
<div id="quiz-screen" class="screen"><div class="wrap sc" id="quiz-wrap"></div></div>

<!-- FEEDBACK / RESULT -->
<div id="result-screen" class="screen" style="align-items:center;justify-content:center;padding:24px"><div class="sc wrap" id="result-wrap" style="max-width:560px;text-align:center"></div></div>

<!-- GAME OVER -->
<div id="gameover-screen" class="screen" style="align-items:center;justify-content:center;padding:24px;text-align:center">
  <div class="sc wrap" style="max-width:520px">
    <div style="font-size:72px;margin-bottom:16px">💀</div>
    <div class="hf" style="font-size:var(--fs-2xl);font-weight:900;color:var(--danger);letter-spacing:2px">DEFEATED</div>
    <p style="color:var(--dim);margin-top:14px;line-height:1.7;font-size:var(--fs-sm)">All <strong>4 Life Powers</strong> have been exhausted. The Methods Vault remains sealed.</p>
    <div id="gameover-stats" class="mf" style="margin-top:20px;color:var(--dim);font-size:var(--fs-sm)"></div>
    <button class="hf" onclick="location.reload()" style="margin-top:26px;padding:16px 40px;background:linear-gradient(135deg,var(--warn),var(--danger));border-radius:12px;color:#fff;font-size:var(--fs-sm);font-weight:700;letter-spacing:1.5px">TRY AGAIN</button>
  </div>
</div>

<!-- VICTORY -->
<div id="victory-screen" class="screen" style="align-items:center;justify-content:center;padding:24px"><div class="sc wrap" id="victory-wrap" style="max-width:600px;text-align:center"></div></div>

<script>
// =====================================================
// FIREBASE — shared with original LangLab project, scoped node
// =====================================================
const firebaseConfig = {
  apiKey: "AIzaSyCiPRWrkFwt4XJJg-S4EoI0PmuYAeGTJZA",
  authDomain: "langlab-escape.firebaseapp.com",
  databaseURL: "https://langlab-escape-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "langlab-escape",
  storageBucket: "langlab-escape.firebasestorage.app",
  messagingSenderId: "611239522142",
  appId: "1:611239522142:web:2444b036c5d8158a5ce9cf"
};
firebase.initializeApp(firebaseConfig);
const fbdb = firebase.database();
const FB_NODE = "langlab-teams";
const FB_KEY_PREFIX = "mv-";
let fbKey = null;

function fbRegister(){
  const slug = S.team.toLowerCase().replace(/[^a-z0-9]/g,"-").slice(0,38) || "team";
  fbKey = FB_KEY_PREFIX + slug + "-" + Date.now().toString(36);
  fbSync();
}
function fbSync(){
  if(!fbKey) return;
  const status = S.endTime
    ? (S.lives > 0 ? "victory" : "defeated")
    : "playing";
  const payload = {
    game: "methods-vault",
    team: S.team,
    p1: S.p1,
    p2: S.p2 || "",
    players: playerLabel(),
    lives: S.lives,
    correct: S.correct,
    qIdx: S.qIdx,
    totalQs: S.totalQs,
    hintsLeft: S.hintsLeft,
    roomsEscaped: status === "victory" ? 1 : 0,
    rooms: { 1: status === "victory" ? "unlocked" : "locked" },
    status: status,
    startTime: S.startTime,
    endTime: S.endTime || null,
    totalTime: S.endTime ? (S.endTime - S.startTime) : null,
    timeMs: S.endTime ? (S.endTime - S.startTime) : (S.startTime ? Date.now() - S.startTime : 0),
    lastUpdate: Date.now()
  };
  fbdb.ref(FB_NODE + "/" + fbKey).update(payload).catch(err=>console.warn("fbSync:", err.message));
}

// =====================================================
// 12 ELT METHODS & APPROACHES — MEDIUM DIFFICULTY
// =====================================================
const QS = [
  {q:"The Grammar-Translation Method is primarily designed to develop:",
   opts:["Speaking and listening fluency","Reading literature and translation skills","Communicative competence","Pronunciation accuracy"],
   ans:1, exp:"GTM emphasises analysing texts, learning rules, and translating between L1 and L2."},

  {q:"Which method insists that the target language be used exclusively in the classroom, with meaning conveyed through demonstration and visuals?",
   opts:["Grammar-Translation","The Audio-Lingual Method","The Direct Method","Suggestopedia"],
   ans:2, exp:"The Direct Method bans the L1; meaning is shown, not translated."},

  {q:"The Audio-Lingual Method is theoretically grounded in:",
   opts:["Cognitivism","Behaviourism (habit formation)","Constructivism","Humanism"],
   ans:1, exp:"ALM treats language as a set of habits formed through repeated drilling and reinforcement."},

  {q:"Communicative Language Teaching (CLT) prioritises:",
   opts:["Memorising grammar rules","Translating literary texts","Meaningful communication and fluency","Silent individual reading"],
   ans:2, exp:"CLT treats the goal of language learning as the ability to communicate."},

  {q:"In Total Physical Response (TPR), developed by James Asher, learners primarily:",
   opts:["Translate sentences orally","Respond physically to spoken commands","Write summaries in pairs","Drill substitution patterns"],
   ans:1, exp:"TPR links listening with bodily action, mirroring how children acquire L1."},

  {q:"Caleb Gattegno's Silent Way is most clearly characterised by:",
   opts:["Constant teacher modelling","Minimal teacher talk and learner discovery","Choral repetition drills","Translation between L1 and L2"],
   ans:1, exp:"The teacher stays largely silent; learners take responsibility for figuring things out."},

  {q:"Suggestopedia (Lozanov) is most associated with:",
   opts:["Drill-and-repeat structures","Silent introspective study","Music, comfortable seating, and a relaxed atmosphere","Translation of classical texts"],
   ans:2, exp:"Lozanov argued that lowering anxiety through music and comfort accelerates acquisition."},

  {q:"In Task-Based Language Teaching (TBLT), an explicit focus on language form usually occurs:",
   opts:["Before learners attempt the task","After learners complete the task","Instead of any task","Only as homework"],
   ans:1, exp:"In TBLT, learners do the task first; language analysis follows from what they needed."},

  {q:"Michael Lewis's Lexical Approach claims that fluency depends largely on:",
   opts:["Mastering verb conjugation tables","Producing original creative sentences","Acquiring chunks and collocations","Drilling phonemic sounds"],
   ans:2, exp:"Language is stored and retrieved in lexical chunks, not assembled word by word."},

  {q:"CLIL stands for:",
   opts:["Communicative Learning in Language","Content and Language Integrated Learning","Cognitive Language Instructional Learning","Classroom Language Input Listening"],
   ans:1, exp:"CLIL teaches a subject (e.g. science) through the medium of the target language."},

  {q:"The PPP framework typically follows which sequence?",
   opts:["Production → Practice → Presentation","Practice → Production → Presentation","Presentation → Practice → Production","Presentation → Production → Practice"],
   ans:2, exp:"Teacher presents the language, learners practise it, then produce it more freely."},

  {q:"Which approach is most strongly associated with Krashen's idea of comprehensible input (i+1)?",
   opts:["The Audio-Lingual Method","The Natural Approach (Krashen & Terrell)","Grammar-Translation","The Silent Way"],
   ans:1, exp:"The Natural Approach builds on Krashen's input hypothesis: input slightly above the learner's current level."},
];

const QUESTION_TIME = 20;
const MAX_LIVES = 4;
const MAX_HINTS = 3;

// =====================================================
// STATE
// =====================================================
let S = {
  p1:"", p2:"", team:"",
  lives: MAX_LIVES,
  hintsLeft: MAX_HINTS,
  qIdx: 0,
  correct: 0,
  startTime: null,
  endTime: null,
  selected: null,
  locked: false,
  timer: null,
  timeLeft: QUESTION_TIME,
  elim: [], // per-question 50/50 eliminations
  totalQs: QS.length,
};

// =====================================================
// HELPERS
// =====================================================
const $ = id => document.getElementById(id);
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  $(id).classList.add('active');
  setBgFor(id);
}
function setBgFor(id){
  const stage = $("bg-stage");
  if(id==="login-screen" || id==="instruct-screen"){
    stage.style.backgroundImage = "url('assets/bg-login.png')";
    stage.style.opacity = "1";
    stage.style.display = "block";
  } else if(id==="quiz-screen" || id==="result-screen" || id==="gameover-screen"){
    stage.style.backgroundImage = "url('assets/bg-question.png')";
    stage.style.opacity = "1";
    stage.style.display = "block";
  } else if(id==="victory-screen"){
    stage.style.backgroundImage = "url('assets/bg-victory.png')";
    stage.style.opacity = "1";
    stage.style.display = "block";
  }
}
function fmtTime(ms){
  const s=Math.floor(ms/1000), m=Math.floor(s/60);
  return m+"m "+String(s%60).padStart(2,"0")+"s";
}
function livesHTML(){
  let h="";
  for(let i=0;i<MAX_LIVES;i++){
    h+=`<span class="life ${i>=S.lives?"lost":""}">${i<S.lives?"❤️":"🖤"}</span>`;
  }
  return h;
}
function playerLabel(){return S.p2 ? `${S.p1} & ${S.p2}` : S.p1;}
function confetti(){
  const b=$("confetti-box");
  b.style.display="block"; b.innerHTML="";
  for(let i=0;i<60;i++){
    const d=document.createElement("div");
    d.className="cp";
    d.style.cssText=`left:${Math.random()*100}%;width:${8+Math.random()*8}px;height:${8+Math.random()*8}px;background:${["#00ff88","#00d4ff","#ff6b35","#c084fc","#ffe066"][i%5]};border-radius:${Math.random()>.5?"50%":"2px"};animation:confetti ${2+Math.random()*2}s ease-out ${Math.random()*.7}s forwards`;
    b.appendChild(d);
  }
  setTimeout(()=>{b.style.display="none";b.innerHTML="";},5200);
}

// =====================================================
// AUDIO
// =====================================================
const bgm = $("bgm");
bgm.volume = 0.35;
let audioPlaying = false;
function tryPlay(){
  bgm.play().then(()=>{
    audioPlaying = true;
    $("audio-toggle").textContent = "⏸";
  }).catch(()=>{});
}
document.addEventListener("click", ()=>{ if(!audioPlaying) tryPlay(); }, {once:true});
window.toggleAudio = function(){
  if(bgm.paused){ bgm.play(); $("audio-toggle").textContent="⏸"; audioPlaying=true; }
  else { bgm.pause(); $("audio-toggle").textContent="▶"; }
};
window.setVol = function(v){
  bgm.volume = v/100;
};

// =====================================================
// LOGIN
// =====================================================
$("login-btn").onclick = function(){
  const p1 = $("p1-input").value.trim();
  const p2 = $("p2-input").value.trim();
  const team = $("team-input").value.trim();
  if(!p1){ $("login-error").textContent = "Player 1 name is required."; return; }
  if(!team){ $("login-error").textContent = "Team name is required."; return; }
  S.p1 = p1; S.p2 = p2; S.team = team;
  S.startTime = Date.now();
  fbRegister();
  showInstructions();
};
["p1-input","p2-input","team-input"].forEach(id=>{
  $(id).onkeydown = e => { if(e.key==="Enter") $("login-btn").click(); };
});

// =====================================================
// INSTRUCTIONS
// =====================================================
function showInstructions(){
  const h = `
    <div style="text-align:center;margin-bottom:22px" class="fi">
      <div style="font-size:44px;margin-bottom:6px">📋</div>
      <div class="hf" style="font-size:var(--fs-xl);font-weight:900;color:var(--neon);letter-spacing:1.5px">MISSION BRIEFING</div>
      <div class="mf" style="font-size:var(--fs-xs);color:var(--gold);margin-top:6px;letter-spacing:1.2px">LANGUAGE INSTITUTE · THAMMASAT UNIVERSITY · RANGSIT CAMPUS</div>
    </div>

    <div class="rule-card"><strong>🏛️ The Setting.</strong> You are inside the <strong>Methods Vault</strong> at the Language Institute, Thammasat University, Rangsit Campus. A single locked door stands between your team and escape. Answer correctly to weaken the lock.</div>

    <div class="rule-card"><strong>👥 Your Team.</strong> Play <strong>solo or as a pair</strong>. A team name is mandatory. Both players share lives, hints, the timer, and the final score.</div>

    <div class="rule-card"><strong>🧠 The Challenges.</strong> You will face <strong>12 multiple-choice questions</strong> on ELT teaching methods and approaches — Grammar-Translation, Direct, Audio-Lingual, CLT, TPR, Silent Way, Suggestopedia, TBLT, the Lexical Approach, CLIL, PPP, and the Natural Approach.</div>

    <div class="rule-card"><strong>⏱️ Time Pressure.</strong> Each question is timed at <strong>20 seconds</strong>. If the timer runs out before you submit, the question is marked wrong and you lose one Life Power.</div>

    <div class="rule-card rule-warning"><strong>❤️ 4 Life Powers.</strong> Your team begins with <strong>4 Life Powers</strong>. Every wrong answer (or time-out) costs <strong>one</strong> life. If all 4 are lost, the game ends instantly — <strong>defeated</strong>. Lives are not refilled.</div>

    <div class="rule-card rule-hint"><strong>🎲 3 Hints — 50/50 Eliminators.</strong> Your team has <strong>three 50/50 hints</strong> for the entire game. Each one removes <strong>two wrong options</strong>, leaving the correct answer and one distractor. Use them wisely on the questions that matter most.</div>

    <div class="rule-card"><strong>🏆 Scoring &amp; Victory.</strong> Reach Question 12 with at least 1 Life Power remaining and the Vault opens. The team with the <strong>most correct answers</strong> in the <strong>fastest total time</strong> wins. Your final time and score are recorded for the leaderboard.</div>

    <div class="rule-card"><strong>🎵 Audio.</strong> Background music plays during the game. Use the <strong>audio console (bottom-right)</strong> to play, pause, or adjust volume at any time.</div>

    <div style="text-align:center;margin-top:26px;padding-bottom:24px">
      <button class="hf glow" onclick="startQuiz()" style="padding:18px 48px;background:linear-gradient(135deg,var(--neon),var(--cyan));border-radius:12px;color:#0B0F1A;font-size:var(--fs-base);font-weight:800;letter-spacing:1.5px">ENTER THE VAULT →</button>
    </div>`;
  $("instruct-wrap").innerHTML = h;
  show("instruct-screen");
}

// =====================================================
// QUIZ FLOW
// =====================================================
window.startQuiz = function(){
  if(!S.startTime) S.startTime = Date.now();
  S.qIdx = 0; S.correct = 0; S.lives = MAX_LIVES; S.hintsLeft = MAX_HINTS;
  fbSync();
  renderQuestion();
};

function renderQuestion(){
  const q = QS[S.qIdx];
  S.selected = null; S.locked = false; S.elim = []; S.timeLeft = QUESTION_TIME;

  const h = `
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px" class="fi">
      <div>
        <div class="mf" style="font-size:var(--fs-xs);color:var(--cyan);letter-spacing:1.5px">TEAM</div>
        <div class="hf" style="font-size:var(--fs-md);font-weight:700;color:var(--neon)">${S.team}</div>
        <div class="mf" style="font-size:var(--fs-xs);color:var(--dim);margin-top:2px">${playerLabel()}</div>
      </div>
      <div id="timer-wrap" class="timer-ring">
        <svg width="74" height="74">
          <circle cx="37" cy="37" r="32" stroke="rgba(107,127,163,.25)" stroke-width="5" fill="none"/>
          <circle id="timer-arc" cx="37" cy="37" r="32" stroke="#00ff88" stroke-width="5" fill="none"
            stroke-dasharray="${2*Math.PI*32}" stroke-dashoffset="0" stroke-linecap="round"/>
        </svg>
        <div class="tnum" id="timer-num">${QUESTION_TIME}</div>
      </div>
      <div style="text-align:right">
        <div class="mf" style="font-size:var(--fs-xs);color:var(--cyan);letter-spacing:1.5px;margin-bottom:3px">LIFE POWERS</div>
        <div>${livesHTML()}</div>
      </div>
    </div>

    <div style="display:flex;gap:5px;margin-bottom:16px">
      ${QS.map((_,i)=>`<div style="flex:1;height:8px;border-radius:4px;background:${i===S.qIdx?"var(--neon)":i<S.qIdx?"rgba(0,255,136,.45)":"rgba(107,127,163,.25)"}"></div>`).join("")}
    </div>

    <div class="card" style="padding:24px">
      <div class="mf" style="font-size:var(--fs-xs);color:var(--cyan);letter-spacing:1.5px;margin-bottom:6px">CHALLENGE ${S.qIdx+1} OF ${QS.length}</div>
      <div style="font-size:var(--fs-md);font-weight:700;line-height:1.55;margin-bottom:8px">${q.q}</div>
    </div>

    <div id="opt-list">
      ${q.opts.map((o,i)=>`
        <button class="opt" id="opt-${i}" onclick="pickOpt(${i})">
          <span class="oc mf">${String.fromCharCode(65+i)}</span><span>${o}</span>
        </button>`).join("")}
    </div>

    <div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;align-items:center;justify-content:space-between">
      <button id="hint-btn" class="hf" onclick="useHint()" style="padding:14px 22px;background:rgba(255,107,53,.12);border:1px solid rgba(255,107,53,.4);border-radius:10px;color:var(--warn);font-size:var(--fs-sm);font-weight:700;letter-spacing:1px">
        🎲 50/50 HINT (<span id="hint-count">${S.hintsLeft}</span> LEFT)
      </button>
      <button id="submit-btn" class="hf" onclick="submitAnswer()" disabled style="padding:14px 28px;background:rgba(107,127,163,.2);border-radius:10px;color:var(--dim);font-size:var(--fs-sm);font-weight:800;letter-spacing:1.5px">SUBMIT →</button>
    </div>
    <div style="height:30px"></div>
  `;
  $("quiz-wrap").innerHTML = h;
  show("quiz-screen");
  startTimer();
}

function startTimer(){
  if(S.timer) clearInterval(S.timer);
  const arc = $("timer-arc");
  const num = $("timer-num");
  const ring = $("timer-wrap");
  const C = 2*Math.PI*32;
  const tick = () => {
    if(S.locked) return;
    num.textContent = S.timeLeft;
    const frac = S.timeLeft/QUESTION_TIME;
    arc.setAttribute("stroke-dashoffset", String(C*(1-frac)));
    if(S.timeLeft <= 5){ ring.classList.add("danger"); arc.setAttribute("stroke","#ff3366"); }
    else if(S.timeLeft <= 10){ ring.classList.add("warn"); arc.setAttribute("stroke","#ff6b35"); }
    if(S.timeLeft <= 0){
      clearInterval(S.timer);
      handleTimeout();
      return;
    }
    S.timeLeft--;
  };
  tick();
  S.timer = setInterval(tick, 1000);
}

window.pickOpt = function(i){
  if(S.locked) return;
  if(S.elim.includes(i)) return;
  S.selected = i;
  document.querySelectorAll(".opt").forEach((el,idx)=>{
    el.classList.toggle("sel", idx===i);
  });
  const sb = $("submit-btn");
  sb.disabled = false;
  sb.style.background = "linear-gradient(135deg,var(--neon),var(--cyan))";
  sb.style.color = "#0B0F1A";
};

window.useHint = function(){
  if(S.locked) return;
  if(S.hintsLeft <= 0) return;
  if(S.elim.length > 0) return; // already used on this question
  const q = QS[S.qIdx];
  const wrong = q.opts.map((_,i)=>i).filter(i=>i!==q.ans);
  // Remove 2 wrongs
  const toElim = wrong.slice(0, 2);
  S.elim = toElim;
  S.hintsLeft--;
  toElim.forEach(i=>$("opt-"+i).classList.add("elim"));
  if(toElim.includes(S.selected)){
    S.selected = null;
    document.querySelectorAll(".opt").forEach(el=>el.classList.remove("sel"));
    const sb = $("submit-btn");
    sb.disabled = true;
    sb.style.background = "rgba(107,127,163,.2)";
    sb.style.color = "var(--dim)";
  }
  $("hint-count").textContent = S.hintsLeft;
  if(S.hintsLeft <= 0){
    const hb = $("hint-btn");
    hb.disabled = true;
    hb.style.opacity = "0.35";
    hb.style.cursor = "default";
  }
};

function handleTimeout(){
  S.locked = true;
  const q = QS[S.qIdx];
  // mark correct option green
  $("opt-"+q.ans).classList.add("right");
  S.lives--;
  setTimeout(()=>showFeedback(false, true), 900);
}

window.submitAnswer = function(){
  if(S.locked) return;
  if(S.selected === null) return;
  S.locked = true;
  if(S.timer) clearInterval(S.timer);
  const q = QS[S.qIdx];
  const isRight = (S.selected === q.ans);
  if(isRight){
    S.correct++;
    $("opt-"+S.selected).classList.add("right");
  } else {
    S.lives--;
    $("opt-"+S.selected).classList.add("wrong");
    $("opt-"+q.ans).classList.add("right");
  }
  setTimeout(()=>showFeedback(isRight, false), 900);
};

function showFeedback(isRight, isTimeout){
  const q = QS[S.qIdx];
  fbSync();
  if(S.lives <= 0){
    S.endTime = Date.now();
    saveLeaderboard();
    fbSync();
    $("gameover-stats").innerHTML = `
      Team <strong style="color:var(--text)">${S.team}</strong><br>
      Correct: <strong style="color:var(--neon)">${S.correct} / ${QS.length}</strong> ·
      Reached: Q${S.qIdx+1} ·
      Time: <strong style="color:var(--warn)">${fmtTime(S.endTime-S.startTime)}</strong>`;
    show("gameover-screen");
    return;
  }
  const isLast = (S.qIdx >= QS.length-1);
  const headColor = isRight ? "var(--neon)" : "var(--danger)";
  const headText  = isTimeout ? "TIME'S UP!" : (isRight ? "CORRECT!" : "INCORRECT");
  const headIcon  = isTimeout ? "⏱️" : (isRight ? "✅" : "❌");
  const livesNote = isRight ? "" : `<p class="mf" style="color:var(--danger);font-size:var(--fs-sm);margin-top:8px">−1 Life Power · ${S.lives} remaining</p>`;
  const h = `
    <div class="card fi" style="padding:32px 24px">
      <div style="font-size:56px;margin-bottom:10px">${headIcon}</div>
      <div class="hf" style="font-size:var(--fs-xl);font-weight:900;color:${headColor};letter-spacing:1.5px;margin-bottom:8px">${headText}</div>
      ${livesNote}
      <div style="margin:20px 0;padding:16px 18px;background:rgba(0,212,255,.08);border-left:3px solid var(--cyan);border-radius:10px;text-align:left;line-height:1.65;font-size:var(--fs-sm);color:var(--text)">
        <span class="mf" style="color:var(--cyan);font-size:var(--fs-xs);letter-spacing:1.2px">CORRECT ANSWER</span><br>
        <strong>${String.fromCharCode(65+q.ans)}. ${q.opts[q.ans]}</strong>
        <div style="margin-top:8px;color:var(--dim)">${q.exp}</div>
      </div>
      <div style="margin-top:14px">${livesHTML()}</div>
      <div class="mf" style="font-size:var(--fs-xs);color:var(--dim);margin-top:6px">Score: <strong style="color:var(--neon)">${S.correct}</strong> / ${QS.length}</div>
      <button class="hf" onclick="${isLast?"finishGame()":"nextQuestion()"}" style="margin-top:22px;padding:16px 40px;background:linear-gradient(135deg,var(--neon),var(--cyan));border-radius:12px;color:#0B0F1A;font-size:var(--fs-sm);font-weight:800;letter-spacing:1.5px">
        ${isLast?"VIEW RESULTS →":"NEXT CHALLENGE →"}
      </button>
    </div>`;
  $("result-wrap").innerHTML = h;
  show("result-screen");
}

window.nextQuestion = function(){
  S.qIdx++;
  renderQuestion();
};

window.finishGame = function(){
  S.endTime = Date.now();
  saveLeaderboard();
  fbSync();
  renderVictory();
};

// =====================================================
// LEADERBOARD (localStorage)
// =====================================================
function saveLeaderboard(){
  try{
    const key = "langlab-methods-leaderboard";
    const board = JSON.parse(localStorage.getItem(key) || "[]");
    board.push({
      team: S.team,
      players: playerLabel(),
      correct: S.correct,
      total: QS.length,
      lives: S.lives,
      timeMs: S.endTime - S.startTime,
      date: new Date().toISOString(),
      completed: S.lives > 0,
    });
    // Sort: correct desc, then time asc
    board.sort((a,b)=>{
      if(b.correct !== a.correct) return b.correct - a.correct;
      return a.timeMs - b.timeMs;
    });
    localStorage.setItem(key, JSON.stringify(board.slice(0,20)));
  }catch(e){}
}
function getLeaderboard(){
  try{
    return JSON.parse(localStorage.getItem("langlab-methods-leaderboard") || "[]");
  }catch(e){ return []; }
}

// =====================================================
// VICTORY
// =====================================================
function renderVictory(){
  confetti();
  const t = fmtTime(S.endTime - S.startTime);
  const d = new Date().toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"});
  const board = getLeaderboard().slice(0,5);
  const myEntry = board.findIndex(e => e.team===S.team && Math.abs(e.timeMs-(S.endTime-S.startTime))<2000);

  let boardHTML = `<div class="mf" style="font-size:var(--fs-xs);color:var(--cyan);letter-spacing:1.5px;margin-bottom:8px">TOP 5 LEADERBOARD</div>`;
  boardHTML += `<table style="width:100%;font-size:var(--fs-sm);border-collapse:collapse;color:var(--text)">
    <thead><tr style="color:var(--dim);font-size:var(--fs-xs)">
      <th style="text-align:left;padding:6px 4px">#</th>
      <th style="text-align:left;padding:6px 4px">TEAM</th>
      <th style="text-align:right;padding:6px 4px">CORRECT</th>
      <th style="text-align:right;padding:6px 4px">TIME</th>
    </tr></thead><tbody>`;
  board.forEach((e,i)=>{
    const isMe = (i === myEntry);
    boardHTML += `<tr style="${isMe?'background:rgba(0,255,136,.12)':''};border-top:1px solid rgba(107,127,163,.18)">
      <td style="padding:8px 4px;color:${isMe?'var(--neon)':'var(--dim)'}">${i+1}</td>
      <td style="padding:8px 4px;color:${isMe?'var(--neon)':'var(--text)'};font-weight:${isMe?'700':'400'}">${e.team}${e.completed?'':' <span style="color:var(--danger);font-size:11px">(defeated)</span>'}</td>
      <td style="padding:8px 4px;text-align:right">${e.correct}/${e.total}</td>
      <td style="padding:8px 4px;text-align:right;font-family:'Source Code Pro',monospace">${fmtTime(e.timeMs)}</td>
    </tr>`;
  });
  boardHTML += `</tbody></table>`;

  $("victory-wrap").innerHTML = `
    <div style="font-size:64px;margin-bottom:12px">🏆</div>
    <div class="hf" style="font-size:var(--fs-2xl);font-weight:900;color:var(--neon);text-shadow:0 0 30px rgba(0,255,136,.5);letter-spacing:2px;margin-bottom:8px">VAULT UNLOCKED!</div>
    <p style="color:var(--dim);margin-bottom:24px;line-height:1.6;font-size:var(--fs-sm)">Outstanding work, <strong style="color:var(--text)">${S.team}</strong>. The Methods Vault yields its secrets to you.</p>

    <div class="card" style="padding:24px;text-align:left">
      <div class="mf" style="font-size:var(--fs-xs);color:var(--cyan);letter-spacing:1.5px;margin-bottom:6px">RESULT CARD · LANGUAGE INSTITUTE · TU RANGSIT</div>
      <div class="hf" style="font-size:var(--fs-lg);color:var(--neon);font-weight:800;margin-bottom:4px">${S.team}</div>
      <div style="font-size:var(--fs-sm);color:var(--dim);margin-bottom:18px">${playerLabel()}</div>
      <div style="display:flex;gap:18px;flex-wrap:wrap;justify-content:space-around;text-align:center;margin:14px 0">
        <div>
          <div class="mf" style="font-size:var(--fs-xs);color:var(--dim);letter-spacing:1px">CORRECT</div>
          <div class="hf" style="font-size:var(--fs-2xl);color:var(--neon);font-weight:800">${S.correct}/${QS.length}</div>
        </div>
        <div>
          <div class="mf" style="font-size:var(--fs-xs);color:var(--dim);letter-spacing:1px">TIME</div>
          <div class="hf" style="font-size:var(--fs-2xl);color:var(--cyan);font-weight:800">${t}</div>
        </div>
        <div>
          <div class="mf" style="font-size:var(--fs-xs);color:var(--dim);letter-spacing:1px">LIVES LEFT</div>
          <div class="hf" style="font-size:var(--fs-2xl);color:var(--gold);font-weight:800">${S.lives}/${MAX_LIVES}</div>
        </div>
      </div>
      <div style="font-size:var(--fs-xs);color:var(--dim);text-align:center;margin-top:6px">${d}</div>
    </div>

    <div class="card" style="padding:18px;text-align:left">${boardHTML}</div>

    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:18px;padding-bottom:30px">
      <button class="hf" onclick="location.reload()" style="padding:14px 32px;background:linear-gradient(135deg,var(--neon),var(--cyan));border-radius:12px;color:#0B0F1A;font-size:var(--fs-sm);font-weight:700;letter-spacing:1px">PLAY AGAIN</button>
    </div>
  `;
  show("victory-screen");
}

show("login-screen");
</script>
